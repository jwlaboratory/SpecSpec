<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Speculative decoding rewards copying the target</title>
  <desc id="desc">A target model wants the phrase the sky is green. The drafter is rewarded for copying that phrase, not for producing the more plausible phrase the sky is blue.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#18865b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b0413e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="#fbfaf7"/>
  <text x="80" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111111">The drafter's job is imitation, not correction</text>
  <text x="80" y="106" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5a554d">Speculative decoding is lossless because the target verifies. Speed comes from matching what the target would say.</text>

  <g filter="url(#shadow)">
    <rect x="78" y="165" width="300" height="170" rx="10" fill="#ffffff" stroke="#d8d3ca" stroke-width="2"/>
    <text x="110" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#55514a">Target model</text>
    <text x="110" y="258" font-family="Georgia, serif" font-size="30" fill="#111111">"the sky is</text>
    <text x="258" y="258" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#18865b">green"</text>
    <text x="110" y="300" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#817d75">Verifier output at temperature 0</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="165" width="300" height="170" rx="10" fill="#ffffff" stroke="#d8d3ca" stroke-width="2"/>
    <text x="482" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#55514a">Drafter should copy</text>
    <text x="482" y="258" font-family="Georgia, serif" font-size="30" fill="#111111">"the sky is</text>
    <text x="630" y="258" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#18865b">green"</text>
    <text x="482" y="300" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#18865b">Accepted: matches the target</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="822" y="165" width="300" height="170" rx="10" fill="#ffffff" stroke="#d8d3ca" stroke-width="2"/>
    <text x="854" y="210" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#55514a">Not the "better" answer</text>
    <text x="854" y="258" font-family="Georgia, serif" font-size="30" fill="#111111">"the sky is</text>
    <text x="1002" y="258" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#2b78d0">blue"</text>
    <text x="854" y="300" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#b0413e">Rejected: disagrees with target</text>
  </g>

  <path d="M 378 250 C 405 250, 420 250, 448 250" fill="none" stroke="#18865b" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="402" y="232" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#18865b">copy</text>
  <path d="M 750 250 C 776 250, 792 250, 820 250" fill="none" stroke="#b0413e" stroke-width="5" stroke-dasharray="9 9" marker-end="url(#arrow-red)"/>
  <text x="772" y="286" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#b0413e">not a match</text>

  <g transform="translate(80 410)">
    <rect x="0" y="0" width="1040" height="110" rx="10" fill="#f2efe8" stroke="#ded9cf"/>
    <text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#333333">Training signal</text>
    <text x="32" y="78" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#55514a">The drafter is rewarded for matching the verifier's next tokens, even when a different answer sounds more natural.</text>
  </g>
</svg>
