<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Small drafters miss long-tail target behavior</title>
  <desc id="desc">A wide target behavior distribution is compared to a smaller drafter approximation that captures the center but clips the tails, representing out-of-distribution domains.</desc>
  <defs>
    <linearGradient id="centerFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2b78d0" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#2b78d0" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="tailFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d86f00" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#d86f00" stop-opacity="0.08"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55514a"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#fbfaf7"/>
  <text x="78" y="72" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111111">A small drafter approximates the center and misses the tails</text>
  <text x="78" y="108" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5a554d">The common region is learned well. Rare languages and other long-tail domains are where acceptance collapses.</text>

  <line x1="95" y1="550" x2="1105" y2="550" stroke="#bdb8ae" stroke-width="2"/>
  <line x1="600" y1="548" x2="600" y2="565" stroke="#bdb8ae" stroke-width="2"/>
  <text x="488" y="600" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#55514a">common target behavior</text>
  <text x="92" y="600" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a85400">long-tail / OOD</text>
  <text x="980" y="600" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a85400">long-tail / OOD</text>

  <path d="M 96 550 C 170 545, 230 510, 292 430 C 326 386, 350 356, 376 328 L 376 550 Z" fill="url(#tailFill)"/>
  <path d="M 824 328 C 850 356, 874 386, 908 430 C 970 510, 1030 545, 1104 550 L 824 550 Z" fill="url(#tailFill)"/>

  <path d="M 96 550 C 190 546, 260 500, 332 392 C 410 270, 478 178, 600 178 C 722 178, 790 270, 868 392 C 940 500, 1010 546, 1104 550" fill="none" stroke="#333333" stroke-width="5" stroke-linecap="round"/>

  <path d="M 376 550 C 420 485, 462 346, 520 280 C 552 244, 578 230, 600 230 C 622 230, 648 244, 680 280 C 738 346, 780 485, 824 550 L 376 550 Z" fill="url(#centerFill)" stroke="none"/>
  <path d="M 376 550 C 420 485, 462 346, 520 280 C 552 244, 578 230, 600 230 C 622 230, 648 244, 680 280 C 738 346, 780 485, 824 550" fill="none" stroke="#2b78d0" stroke-width="5" stroke-linecap="round"/>

  <line x1="376" y1="548" x2="376" y2="250" stroke="#d86f00" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="824" y1="548" x2="824" y2="250" stroke="#d86f00" stroke-width="3" stroke-dasharray="8 8"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="130" y="170" width="275" height="92" rx="10" fill="#ffffff" stroke="#ded9cf"/>
    <text x="154" y="204" font-size="18" font-weight="700" fill="#333333">Target model behavior</text>
    <line x1="154" y1="228" x2="218" y2="228" stroke="#333333" stroke-width="5" stroke-linecap="round"/>
    <text x="232" y="234" font-size="16" fill="#55514a">wide distribution</text>

    <rect x="795" y="170" width="275" height="92" rx="10" fill="#ffffff" stroke="#ded9cf"/>
    <text x="819" y="204" font-size="18" font-weight="700" fill="#333333">Drafter approximation</text>
    <line x1="819" y1="228" x2="883" y2="228" stroke="#2b78d0" stroke-width="5" stroke-linecap="round"/>
    <text x="897" y="234" font-size="16" fill="#55514a">narrower capacity</text>

    <path d="M 278 278 C 244 320, 215 360, 190 420" fill="none" stroke="#55514a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="120" y="454" font-size="18" font-weight="700" fill="#a85400">missed tail</text>
    <path d="M 922 278 C 956 320, 985 360, 1010 420" fill="none" stroke="#55514a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="982" y="454" font-size="18" font-weight="700" fill="#a85400">missed tail</text>

    <text x="486" y="342" font-size="20" font-weight="700" fill="#2b78d0">covered well</text>
    <text x="458" y="372" font-size="16" fill="#55514a">high-frequency target behavior</text>
  </g>
</svg>
